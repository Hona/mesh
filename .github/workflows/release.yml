# Build and publish release binaries for a v* tag (SPEC §10). Build only: no tests, no lint.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $v"
            exit 1
          fi

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (static musl via zig)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          python3 -m pip install --user --break-system-packages cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          mkdir dist
          for t in x86_64:x64 aarch64:arm64; do
            cargo zigbuild --release --bin mesh --target "${t%%:*}-unknown-linux-musl"
            cp "target/${t%%:*}-unknown-linux-musl/release/mesh" "dist/mesh-linux-${t##*:}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          mkdir dist
          for t in x86_64:x64 aarch64:arm64; do
            cargo build --release --bin mesh --target "${t%%:*}-apple-darwin"
            cp "target/${t%%:*}-apple-darwin/release/mesh" "dist/mesh-macos-${t##*:}"
          done
      # One self-signed identity for every release, so TCC grants survive updates (SPEC §10).
      - name: Sign
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::MACOS_SIGN_P12 isn't set: the macOS binaries keep their ad-hoc signature, so macOS privacy grants (Accessibility, Screen Recording, folders) reset on every update"
            exit 0
          fi
          kc="$RUNNER_TEMP/sign.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf %s "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          for f in dist/mesh-macos-*; do
            codesign -f -s "opencode mesh" --keychain "$kc" -i opencode.mesh --timestamp=none "$f"
            codesign -v --strict "$f"
            codesign -d -r- "$f"
          done
          security delete-keychain "$kc"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          mkdir dist
          for t in x86_64:x64 aarch64:arm64; do
            cargo build --release --target "${t%%:*}-pc-windows-msvc"
            for b in mesh meshw; do
              cp "target/${t%%:*}-pc-windows-msvc/release/$b.exe" "dist/$b-windows-${t##*:}.exe"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # A release for the tag may already exist (a re-run, or one made by hand): replace its assets.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists: uploading with --clobber"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre *
          fi
